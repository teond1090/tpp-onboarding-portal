name: Rebuild document PDFs and page images

# Converts documents/tpp/*.docx to PDF and re-renders the page images the
# portal displays, then commits them.
#
# A runner does this rather than the authoring sandbox because LibreOffice
# cannot load a document there at all — even a trivial one — so the PDFs
# cannot be regenerated from the Word originals locally.
on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Document folder to rebuild'
        required: false
        default: 'documents/tpp'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice and poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils

      - name: Convert and render
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          set -euo pipefail
          FOLDER=${FOLDER:-documents/tpp}
          mkdir -p "$FOLDER/page"
          shopt -s nullglob
          for f in "$FOLDER"/*.docx; do
            stem=$(basename "$f" .docx)
            echo "::group::$stem"
            soffice --headless --norestore --convert-to pdf --outdir "$FOLDER" "$f"
            pdf="$FOLDER/$stem.pdf"
            [ -s "$pdf" ] || { echo "FAILED to produce $pdf"; exit 1; }
            # the portal shows one ~1000px-wide JPG per page
            rm -f "$FOLDER"/page/"$stem"-p*.jpg
            pdftoppm -jpeg -r 150 -scale-to-x 1000 -scale-to-y -1 "$pdf" "$FOLDER/page/$stem-p"
            for p in "$FOLDER"/page/"$stem"-p*.jpg; do
              mv "$p" "$(echo "$p" | sed -E 's/-p0*([0-9]+)\.jpg$/-p\1.jpg/')" 2>/dev/null || true
            done
            echo "  $(pdfinfo "$pdf" | awk '/^Pages/{print $2}') page(s)"
            echo "::endgroup::"
          done
          echo "--- page counts ---"
          for f in "$FOLDER"/*.pdf; do echo "$(basename "$f" .pdf): $(pdfinfo "$f" | awk '/^Pages/{print $2}')"; done

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A documents/
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Rebuild document PDFs and page images from the Word originals"
          git push
